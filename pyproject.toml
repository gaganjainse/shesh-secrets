[project]
name = "shesh-secrets"
version = "0.1.0"
description = "Shesh Brain: secret resolution from env/gopass/keepassxc/file"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gagan Jain" }]
dependencies = ["fastmcp>=3.4.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
shesh-secrets-mcp = "shesh_secrets.server:main"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E","F","W","UP","B","SIM","I"]
ignore = ["E402"]
[tool.pytest.ini_options]

pythonpath = ["src"]
testpaths = ["tests"]
